[project]
name = "oak-binder"
version = "0.1.0"
description = "OAK Audit - Working Paper Binder (SA 230): the audit file, its working papers, sign-off, assembly and retention."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  # Multipart form parsing: attachment upload (spec 3B, 3G).
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  # The Google Drive vault adapter talks to the Drive REST API directly (D27).
  "httpx>=0.27",
]
# Hashing (spec 3F, 8.5) uses hashlib and the produce-file archive (spec 3G, 8.6) uses
# zipfile, both from the standard library. No extra dependency for either.

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_binder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
  "db: needs the oak_binder_test database (skipped when OAK_TEST_DATABASE_URL is unset)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
