# Alembic configuration for the Working Paper Binder.
# The database URL is NOT here. alembic/env.py reads OAK_MIGRATION_DATABASE_URL from the
# environment or backend\.env, and refuses any database other than oak_binder or
# oak_binder_test. Run from backend\.
#
# Show the SQL without connecting:   alembic upgrade head --sql
# Apply (Stage 3 onwards):            alembic upgrade head

[alembic]
# %(here)s is the folder holding this file, so Alembic works from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
